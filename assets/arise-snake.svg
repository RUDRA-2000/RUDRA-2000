<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        font-size="120"
        font-family="Orbitron, Arial"
        font-weight="900"
        letter-spacing="18"
        fill="url(#textGradient)"
        filter="url(#glow)">
    ARISE

    <!-- Pulsing -->
    <animate attributeName="opacity"
             values="0.85;1;0.85"
             dur="3s"
             repeatCount="indefinite"/>
  </text>

  <!-- Snake Path -->
  <path id="snakePath"
        d="M120 220 C 280 100, 480 260, 650 150 S 980 120, 1080 170"
        fill="none"
        stroke="transparent"
        stroke-width="2"/>

  <!-- Snake Trail -->
  <path d="M120 220 C 280 100, 480 260, 650 150 S 980 120, 1080 170"
        fill="none"
        stroke="#5B21B6"
        stroke-width="6"
        opacity="0.15">

    <animate attributeName="opacity"
             values="0.1;0.3;0.1"
             dur="2s"
             repeatCount="indefinite"/>
  </path>

  <!-- Snake -->
  <g filter="url(#snakeGlow)">

    <!-- Snake Body -->
    <circle r="14" fill="url(#snakeGradient)">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>

    <!-- Snake Eye -->
    <circle r="3" fill="#ffffff">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>

  </g>

  <!-- Shadow Aura -->
  <ellipse cx="600" cy="250" rx="300" ry="30" fill="#7F00FF" opacity="0.08">
    <animate attributeName="opacity"
             values="0.05;0.12;0.05"
             dur="4s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- Footer Quote -->
  <text x="600" y="290"
        text-anchor="middle"
        font-size="20"
        font-family="Arial"
        fill="#C084FC"
        opacity="0.8">
    「 Arise. 」
  </text>

</svg>
