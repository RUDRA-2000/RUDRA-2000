
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#1a103d"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <linearGradient id="snakeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)" />

  <!-- ARISE -->
  <text x="600"
        y="170"
        text-anchor="middle"
        font-size="120"
        font-family="Arial"
        font-weight="900"
        letter-spacing="18"
        fill="url(#textGradient)"
        filter="url(#glow)">

    ARISE

    <animate attributeName="opacity"
             values="0.7;1;0.7"
             dur="3s"
             repeatCount="indefinite"/>

  </text>

  <!-- Snake Path -->
  <path id="snakePath"
        d="M120 220 C 280 100, 480 260, 650 150 S 980 120, 1080 170"
        fill="none"
        stroke="transparent"/>

  <!-- Snake -->
  <circle r="14"
          fill="url(#snakeGradient)"
          filter="url(#glow)">

    <animateMotion dur="8s"
                   repeatCount="indefinite"
                   rotate="auto">

      <mpath href="#snakePath"/>

    </animateMotion>

  </circle>

  <!-- Footer -->
  <text x="600"
        y="290"
        text-anchor="middle"
        font-size="20"
        font-family="Arial"
        fill="#C084FC">

    「 Arise. 」

  </text>

</svg>
